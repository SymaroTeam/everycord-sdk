org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# The SDK version to use (SDK/scripts/build-android.sh passes its own).
everycord.sdkVersion=1.0.0
# Your publishable key from the EveryCord partner console (an ecpk_test_ key while you build). Set it here or pass
# -Peverycord.publishableKey=ecpk_test_...
everycord.publishableKey=ecpk_test_ReplaceWithYourTestKeyFromTheConsole
